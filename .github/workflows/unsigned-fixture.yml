name: unsigned-fixture

# Publishes a deliberately UNSIGNED tag (a plain copy of upstream nginx) so an
# admission policy has something to reject. Manual trigger only.

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  copy-unsigned:
    runs-on: ubuntu-latest
    steps:
      - name: Install crane
        uses: imjasonh/setup-crane@v0.7

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | crane auth login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Copy upstream image to the unsigned tag (no cosign)
        run: |
          crane copy nginxinc/nginx-unprivileged:1.27-alpine ghcr.io/betv3/hello-signed:unsigned
          echo "unsigned digest: $(crane digest ghcr.io/betv3/hello-signed:unsigned)"
